# 唯一在线音源：网易云 musicbox（https://github.com/darknessomi/musicbox）
#
# v2.0 起已移除 musicdl（酷我/咪咕聚合）与 lxmusic（洛雪解析）两个第三方免登录音源，
# 所有在线曲目都来自扫码登录的那个私人网易云账号的权益。
#
# 基础镜像与 pip 源可由根目录 .env 覆盖（FNMUSIC_BASE_IMAGE / FNMUSIC_PIP_INDEX），
# 其中基础镜像由 ensure_base_image.sh 自动探测维护：国内镜像优先直连（绕开 daemon
# 加速器），官方源兜底（不修改系统 Docker 配置，仅本应用构建生效）。
#
# musicbox 端口对外绑定 0.0.0.0，是为了让局域网内能用浏览器打开二维码图片扫码登录：
#   http://<NAS_IP>:8770/api/v1/auth/login/qr.png
# 若不需要该方式，可改成 127.0.0.1:8770:8000，改用 ./netease_login.sh 终端扫码。
services:
  musicbox:
    build:
      context: ./musicbox-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: fnmusic-musicbox
    ports:
      - "0.0.0.0:8770:8000"
    volumes:
      # 网易云登录 cookie 与缓存的唯一持久化位置，重扫登录/升级都不丢
      - ./musicbox-data:/data
    environment:
      # 未登录时是否降级为只播免费曲目（与代理层保持同一份语义）
      - FNMUSIC_FREE_ONLY_ON_LOGOUT=${FNMUSIC_FREE_ONLY_ON_LOGOUT:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
