# 在线音源：
#   - musicbox：网易云（https://github.com/darknessomi/musicbox）
#   - musicsource：QQ / 酷狗 / 酷我 / 汽水（本仓库 musicsource-service，v2.10+）
#
# 扩展音源服务默认启用；不需要时在 .env 里设 FNMUSIC_EXTRA_ENABLED=false，
# 或把 EXTRA_SOURCES 置空。
#
# 默认只监听 127.0.0.1：音源接口无鉴权，对外暴露请自行防火墙隔离。
services:
  musicbox:
    build:
      context: ./musicbox-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: fnmusic-musicbox
    ports:
      - "${FNMUSIC_MUSICBOX_BIND:-127.0.0.1}:8770:8000"
    volumes:
      # 网易云登录 cookie 与缓存的唯一持久化位置，重扫登录/升级都不丢
      - ./musicbox-data:/data
    environment:
      # 未登录时是否降级为只播免费曲目（与代理层保持同一份语义）
      - FNMUSIC_FREE_ONLY_ON_LOGOUT=${FNMUSIC_FREE_ONLY_ON_LOGOUT:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  musicsource:
    build:
      context: ./musicsource-service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: fnmusic-musicsource
    ports:
      - "${FNMUSIC_MUSICSOURCE_BIND:-127.0.0.1}:8771:8000"
    environment:
      - FNMUSIC_EXTRA_SOURCES=${FNMUSIC_EXTRA_SOURCES:-qq,kugou,kuwo,qishui}
      - FNMUSIC_QQ_ENABLED=${FNMUSIC_QQ_ENABLED:-true}
      - FNMUSIC_KUGOU_ENABLED=${FNMUSIC_KUGOU_ENABLED:-true}
      - FNMUSIC_KUWO_ENABLED=${FNMUSIC_KUWO_ENABLED:-true}
      - FNMUSIC_QISHUI_ENABLED=${FNMUSIC_QISHUI_ENABLED:-true}
      - FNMUSIC_QISHUI_API_BASE=${FNMUSIC_QISHUI_API_BASE:-}
      - FNMUSIC_EXTRA_API_BASE=${FNMUSIC_EXTRA_API_BASE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
